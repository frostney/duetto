# Thin caller for known-good-route's reusable project-skills refresh
# (see .agents/skills/maintain-project-skills/references/
# project-skills-runbook.md). The refresh job runs read-only; the publish
# job opens or updates a DRAFT pull request on the automation branch,
# which then goes through ordinary review. Pin: KGR main at the SHA below;
# bump it only after reading the KGR diff between the two pins.
name: Update project Agent Skills

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update:
    uses: frostney/known-good-route/.github/workflows/update-project-skills.yml@bb3ec0bc7505c60fcc623b98d76fbaf8d0f77c9c # main 2026-09-17
    with:
      skills-root: "."
      skills-cli-version: "1.5.23"
      pr-branch: "automation/update-agent-skills"
