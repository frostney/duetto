# duetto — lightweight WebSocket for Pascal (RFC 6455 + RFC 7692)
# Bootstrapped with `lwpt init`; built/tested/formatted via lwpt.

[package]
name = "duetto"
version = "0.4.0"
# lwpt discovers dep units through nested manifests, so only
# duetto's own source dir is listed here. Dep test files are excluded at
# fetch time so `lwpt test` (which walks every units dir) only
# discovers duetto's own suites. lwpt (0.4.0+) excludes its own toolkit
# state from formatting by default; the [format] exclude below stays as
# a belt against the units-carving behaviour, so the formatter can never
# rewrite fetched modules out from under the lockfile hash.
units = ["source/units"]

[format]
exclude = [".lwpt/**"]

[dependencies]
# Resolved from the lwpt 0.7.0 release tag via include filters (one
# filtered fetch per package). httpclient brings HTTPClient +
# TransportSecurity (TLS) + StringBuffer; cli is the option/parser/help
# framework the source/apps programs build their flags on.
httpclient = { source = "frostney/lwpt", version = "^0.7.0", include = ["packages/httpclient/**"], exclude = ["**/*.Test.pas", "**/Tests.*.pas"] }
testing = { source = "frostney/lwpt", version = "^0.7.0", include = ["packages/testing/**"], exclude = ["**/*.Test.pas"] }
cli = { source = "frostney/lwpt", version = "^0.7.0", include = ["packages/cli/**"], exclude = ["**/*.Test.pas"] }

[build]
wsecho    = { source = "source/apps/wsecho.pas",    output = "build/wsecho" }
wsbench   = { source = "source/apps/wsbench.pas",   output = "build/wsbench" }
wsinterop = { source = "source/apps/wsinterop.pas", output = "build/wsinterop" }
wsprobe   = { source = "source/apps/wsprobe.pas",   output = "build/wsprobe" }
wsautobahn = { source = "source/apps/wsautobahn.pas", output = "build/wsautobahn" }

# Analysis gates. Limits sit just above the measured 2026-09 baseline
# (lwpt health / lwpt duplication): file cyclomatic 234, file cognitive 328, routine cyclomatic 60,
# routine cognitive 114, duplication 1.01%.
# Regression ratchets — CI fails when a change pushes a metric past
# its ceiling.
[health]
max-file-cyclomatic = 250
max-file-cognitive = 350
max-routine-cyclomatic = 70
max-routine-cognitive = 130

[duplication]
maximum-percent = 2
