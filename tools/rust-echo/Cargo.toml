# tungstenite echo baseline for docs/comparison.md (tools/benchmatrix.sh).
# Cargo.lock is committed (resolved with rustc 1.98): `cargo build
# --release --locked` builds the measured versions. An older toolchain
# (e.g. rustc 1.75 from Ubuntu 24.04 apt) may need newer crates held back,
# e.g. `cargo update -p idna_adapter --precise 1.1.0`.
[package]
name = "rust-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = "0.21"

[profile.release]
lto = true
opt-level = 3
